<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đặt lịch hẹn trực tuyến - Chọn ngày giờ phù hợp và đặt cuộc hẹn nhanh chóng">
  <title>Cổng Đặt Lịch Hẹn - YOUR_NAME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Effects -->
  <div class="bg-effects">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
  </div>

  <div class="page-wrapper">

    <!-- Top Bar -->
    <div class="top-bar fade-up">
      <span class="greeting">Chào bạn! Hãy chọn khung giờ phù hợp nhé.</span>
      <a href="https://zalo.me/g/igkywu632" target="_blank" rel="noopener" class="author-brand" id="author-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        YOUR_NAME
      </a>
    </div>

    <!-- Title -->
    <h1 class="page-title fade-up">Cổng Đặt Lịch Hẹn</h1>
    <p class="page-subtitle fade-up">Chọn ngày, khung giờ và điền thông tin - lịch hẹn sẽ được tạo tự động trên Google Calendar.</p>

    <!-- Main 2-Column Grid -->
    <div class="main-grid">

      <!-- Left Column: Date + Slots -->
      <div class="glass-card fade-up" id="card-schedule">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Chọn lịch hẹn
        </div>

        <!-- Date Picker -->
        <label class="field-label" for="date-picker">Chọn ngày</label>
        <div class="date-input-wrap">
          <input type="date" id="date-picker">
        </div>

        <!-- Duration -->
        <label class="field-label" for="duration-select">Thời lượng dự kiến</label>
        <div class="select-wrap">
          <select id="duration-select"></select>
        </div>

        <!-- Time Slots -->
        <div class="slots-label">Giờ trống khả dụng:</div>
        <div class="slots-grid" id="slots-container">
          <!-- Generated by JS -->
        </div>
      </div>

      <!-- Right Column: Booking Form -->
      <div class="glass-card fade-up" id="card-form">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
          </svg>
          Thông tin đặt hẹn
        </div>

        <form id="booking-form" autocomplete="off">
          <div class="form-group">
            <label class="field-label" for="input-name">Tên của bạn *</label>
            <input type="text" id="input-name" class="form-input" placeholder="Nguyễn Văn A" required>
          </div>

          <div class="form-group">
            <label class="field-label" for="input-email">Email của bạn *</label>
            <input type="email" id="input-email" class="form-input" placeholder="email@example.com" required>
          </div>

          <div class="form-group">
            <label class="field-label">Hình thức gặp mặt</label>
            <div class="radio-group">
              <label class="radio-option active" data-value="online">
                <input type="radio" name="meetingType" value="online" checked>
                <span class="radio-dot"></span>
                Họp trực tuyến (Google Meet)
              </label>
              <label class="radio-option" data-value="offline">
                <input type="radio" name="meetingType" value="offline">
                <span class="radio-dot"></span>
                Offline
              </label>
            </div>
          </div>


          <div class="form-group">
            <label class="field-label" for="input-notes">Lời nhắn, nội dung cuộc hẹn</label>
            <textarea id="input-notes" class="form-textarea" placeholder="Mô tả ngắn về nội dung bạn muốn trao đổi..."></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            <span class="spinner"></span>
            <span class="btn-text">Xác nhận đặt lịch</span>
          </button>
        </form>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
